              return u if re.match(r"^https?://", u, re.I) else ""


          def parse_feed(data, source):
              root = ET.fromstring(data)
              entries = [e for e in root.iter() if local(e.tag) in ("item", "entry")]
              items = []
              for e in entries[:PER_SOURCE * 2]:
                  f = {"title": "", "link": "", "date": None, "desc": "", "image": ""}
                  for c in e:
                      t = local(c.tag)
                      txt = (c.text or "").strip()
                      if t == "title":
                          f["title"] = clean(txt)
                      elif t == "link":
                          f["link"] = safe_url(c.attrib.get("href") or txt) or f["link"]
                      elif t in ("pubdate", "published", "updated", "date") and not f["date"]:
                          f["date"] = parse_date(txt)
                      elif t in ("description", "summary") and not f["desc"]:
                          f["desc"] = txt
                      elif t == "encoded" and not f["desc"]:
                          f["desc"] = txt
                      elif t in ("content", "thumbnail", "enclosure"):
                          u = safe_url(c.attrib.get("url"))
                          typ = (c.attrib.get("type") or c.attrib.get("medium") or "image").lower()
                          if u and "image" in typ and not f["image"]:
                              f["image"] = u
                  if not f["image"]:
                      m = re.search(r'<img[^>]+src=["\']([^"\']+)["\']', f["desc"], re.I)
                      if m:
                          f["image"] = safe_url(html.unescape(m.group(1)))
                  if f["title"] and f["link"]:
                      items.append({"title": f["title"], "link": f["link"], "source": source,
                                    "date": f["date"], "summary": clean(f["desc"], SUMMARY_CHARS), "image": f["image"]})
              return items[:PER_SOURCE]


          def og_image(url):
              """Ambil gambar utama (og:image) dari halaman artikel bila RSS tidak menyertakan gambar."""
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      page = r.read(300000).decode("utf-8", "ignore")
              except Exception:
                  return ""
              for pat in (r'<meta[^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]*content=["\']([^"\']+)["\']',
                          r'<meta[^>]+content=["\']([^"\']+)["\'][^>]*(?:property|name)=["\'](?:og:image|twitter:image)["\']'):
                  m = re.search(pat, page, re.I)
                  if m:
                      return safe_url(urllib.parse.urljoin(url, html.unescape(m.group(1))))
              return ""


          def discover(base, data):
              text = data.decode("utf-8", "ignore")
              found = re.findall(r'<link[^>]+type=["\']application/(?:rss|atom)\+xml["\'][^>]*href=["\']([^"\']+)["\']', text, re.I)
              found += re.findall(r'href=["\']([^"\']+\.xml)["\']', text, re.I)
              out = []
              for f in found:
                  u = urllib.parse.urljoin(base, f)
                  if u not in out:
                      out.append(u)
              return out[:5]


          def load_source(src):
              for url in src["urls"]:
                  try:
                      data = fetch(url)
                      try:
                          items = parse_feed(data, src["name"])
                      except ET.ParseError:
                          items = []
                          for alt in discover(url, data):
                              try:
                                  items = parse_feed(fetch(alt), src["name"])
                                  if items:
                                      break
                              except Exception:
                                  continue
                      if items:
                          print(f"[ok]   {src['name']}: {len(items)} berita dari {url}")
                          return items
                      print(f"[kosong] {src['name']}: {url}")
                  except Exception as ex:
                      print(f"[gagal] {src['name']}: {url} -> {ex}")
              return []


          def main():
              items, seen = [], set()
              for src in SOURCES:
                  for it in load_source(src):
                      key = re.sub(r"[?#].*$", "", it["link"])
                      if key not in seen:
                          seen.add(key)
                          items.append(it)
              if not items:
                  print("Tidak ada berita yang berhasil diambil; articles.json dibiarkan seperti semula.")
                  return 0
              items.sort(key=lambda x: x["date"] or "", reverse=True)
              items = items[:MAX_ITEMS]
              fetched = 0
              for it in items:                       # lengkapi gambar yang kosong (maks. 12 halaman per proses)
                  if not it["image"] and fetched < 12:
                      fetched += 1
                      it["image"] = og_image(it["link"])
              try:
                  old = json.load(open(OUT, encoding="utf-8")).get("items")
              except Exception:
                  old = None
              if old == items:
                  print("Tidak ada perubahan.")
                  return 0
              data = {"updated": datetime.now(timezone.utc).isoformat(timespec="seconds"), "items": items}
              with open(OUT, "w", encoding="utf-8") as fh:
                  json.dump(data, fh, ensure_ascii=False, indent=2)
              print(f"articles.json diperbarui: {len(items)} berita.")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
