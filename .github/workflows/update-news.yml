# Update berita otomotif otomatis
# Path: .github/workflows/update-news.yml

name: Update berita otomotif

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil berita dan gambar dari RSS
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import html
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET

          OUT = os.environ.get("NEWS_OUT", "articles.json")
          MAX_ITEMS = 12
          PER_SOURCE = 8
          SUMMARY_CHARS = 170
          UA = (
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/124.0 Safari/537.36 "
              "ThomyShowroomBot/2.0"
          )

          SOURCES = [
              {
                  "name": "Antara Otomotif",
                  "urls": [
                      "https://otomotif.antaranews.com/rss/terkini.xml",
                      "https://www.antaranews.com/rss/otomotif.xml",
                      "https://otomotif.antaranews.com/rss"
                  ]
              },
              {
                  "name": "detikOto",
                  "urls": [
                      "https://rss.detik.com/index.php/oto",
                      "https://oto.detik.com/rss"
                  ]
              },
              {
                  "name": "Kompas Otomotif",
                  "urls": [
                      "https://otomotif.kompas.com/rss",
                      "https://www.kompas.com/getrss/otomotif"
                  ]
              }
          ]

          if os.environ.get("FEEDS_OVERRIDE"):
              SOURCES = json.loads(os.environ["FEEDS_OVERRIDE"])

          def fetch(url, limit=None, timeout=20):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/rss+xml, application/atom+xml, "
                                "application/xml, text/xml, text/html, */*"
                  }
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  data = response.read(limit) if limit else response.read()
                  return data, response.headers.get("Content-Type", "")

          def local(tag):
              return tag.rsplit("}", 1)[-1].lower() if isinstance(tag, str) else ""

          def clean(value, limit=None):
              value = html.unescape(re.sub(r"<[^>]+>", " ", value or ""))
              value = re.sub(r"\s+", " ", value).strip()
              value = re.sub(
                  r"^[A-Za-z .]{2,40}\((?:ANTARA|[A-Za-z]+)\)\s*[-–]\s*",
                  "", value
              )
              if limit and len(value) > limit:
                  value = value[:limit].rsplit(" ", 1)[0].rstrip(",.;:- ") + "…"
              return value

          def parse_date(value):
              if not value:
                  return None
              try:
                  dt = parsedate_to_datetime(value.strip())
              except Exception:
                  try:
                      dt = datetime.fromisoformat(value.strip().replace("Z", "+00:00"))
                  except Exception:
                      return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc).isoformat(timespec="seconds")

          def safe_url(value, base=""):
              value = html.unescape((value or "").strip()).replace("&amp;", "&")
              if not value or value.startswith(("data:", "javascript:")):
                  return ""
              value = urllib.parse.urljoin(base, value) if base else value
              parsed = urllib.parse.urlparse(value)
              if parsed.scheme not in ("http", "https") or not parsed.netloc:
                  return ""
              return value

          def image_from_html(fragment, base=""):
              if not fragment:
                  return ""
              # Gambar dalam description/content:encoded.
              patterns = [
                  r'<img\b[^>]*?\bsrc\s*=\s*["\']([^"\']+)["\']',
                  r'<img\b[^>]*?\bdata-src\s*=\s*["\']([^"\']+)["\']',
                  r'<source\b[^>]*?\bsrcset\s*=\s*["\']([^"\']+)["\']'
              ]
              for pattern in patterns:
                  match = re.search(pattern, fragment, re.I)
                  if match:
                      candidate = match.group(1).split(",")[0].strip().split(" ")[0]
                      result = safe_url(candidate, base)
                      if result:
                          return result
              return ""

          def rss_image(entry, article_link):
              # Cari media:content, media:thumbnail, enclosure, image dan
              # URL gambar yang mungkin berada di elemen bersarang.
              for node in entry.iter():
                  tag = local(node.tag)
                  attrs = {str(k).lower(): v for k, v in node.attrib.items()}
                  candidates = []
                  if tag in ("content", "thumbnail", "enclosure", "image"):
                      candidates.extend([
                          attrs.get("url"), attrs.get("href"), attrs.get("src")
                      ])
                  if tag == "link" and attrs.get("rel", "").lower() == "enclosure":
                      candidates.extend([attrs.get("href")])
                  for candidate in candidates:
                      url = safe_url(candidate, article_link)
                      if url:
                          media_type = (
                              attrs.get("type", "") + " " +
                              attrs.get("medium", "") + " " + tag
                          ).lower()
                          if tag in ("thumbnail", "image") or "image" in media_type or not attrs.get("type"):
                              return url
              # Fallback untuk HTML di description/content:encoded.
              for node in entry.iter():
                  if local(node.tag) in ("description", "encoded", "summary", "content"):
                      found = image_from_html(node.text or "", article_link)
                      if found:
                          return found
              return ""

          class MetaImageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.images = []
                  self.content_images = []
              def handle_starttag(self, tag, attrs):
                  a = {k.lower(): v for k, v in attrs if k and v}
                  if tag.lower() == "meta":
                      key = (a.get("property") or a.get("name") or "").lower()
                      if key in ("og:image", "og:image:url", "twitter:image", "twitter:image:src"):
                          self.images.append(a.get("content", ""))
                      if a.get("itemprop", "").lower() == "image":
                          self.images.append(a.get("content", "") or a.get("src", ""))
                  elif tag.lower() in ("img", "source"):
                      candidate = a.get("data-src") or a.get("data-lazy-src") or a.get("src") or ""
                      if not candidate and a.get("srcset"):
                          candidate = a["srcset"].split(",")[0].strip().split(" ")[0]
                      if candidate:
                          self.content_images.append(candidate)

          def page_image(url):
              try:
                  data, _ = fetch(url, limit=1200000, timeout=15)
                  page = data.decode("utf-8", "ignore")
                  parser = MetaImageParser()
                  parser.feed(page)
                  # Metadata sosial/SEO adalah sumber paling akurat.
                  candidates = list(parser.images)
                  # JSON-LD bisa berisi array gambar atau objek ImageObject.
                  for match in re.findall(
                      r'"image"\s*:\s*(?:"([^"]+)"|\[\s*"([^"]+)"|\{[^}]*?"url"\s*:\s*"([^"]+)")',
                      page, re.I
                  ):
                      candidates.extend([value for value in match if value])
                  # Jika publisher tidak menyediakan metadata, coba gambar konten artikel.
                  candidates.extend(parser.content_images[:12])
                  seen_candidates = set()
                  for candidate in candidates:
                      result = safe_url(candidate, url)
                      if result and result not in seen_candidates:
                          seen_candidates.add(result)
                          if image_is_reachable(result):
                              return result
              except Exception as error:
                  print(f"[image] metadata gagal {url}: {error}")
              return ""

          def image_is_reachable(url):
              if not url:
                  return False
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": UA, "Range": "bytes=0-1023"}
                  )
                  with urllib.request.urlopen(req, timeout=10) as response:
                      content_type = response.headers.get("Content-Type", "").lower()
                      sample = response.read(32)
                  return content_type.startswith("image/") or sample.startswith(
                      (b"\xff\xd8\xff", b"\x89PNG", b"GIF8", b"RIFF")
                  )
              except Exception:
                  return False

          def parse_feed(data, source):
              root = ET.fromstring(data)
              entries = [
                  element for element in root.iter()
                  if local(element.tag) in ("item", "entry")
              ]
              items = []
              for entry in entries[:PER_SOURCE * 2]:
                  article = {"title": "", "link": "", "date": None, "desc": "", "image": ""}
                  for child in entry:
                      tag = local(child.tag)
                      value = (child.text or "").strip()
                      if tag == "title" and not article["title"]:
                          article["title"] = clean(value)
                      elif tag == "link":
                          article["link"] = (
                              safe_url(child.attrib.get("href") or value)
                              or article["link"]
                          )
                      elif tag in ("pubdate", "published", "updated", "date") and not article["date"]:
                          article["date"] = parse_date(value)
                      elif tag in ("description", "summary", "encoded") and not article["desc"]:
                          article["desc"] = value
                  if article["title"] and article["link"]:
                      article["image"] = rss_image(entry, article["link"])
                      items.append({
                          "title": article["title"],
                          "link": article["link"],
                          "source": source,
                          "date": article["date"],
                          "summary": clean(article["desc"], SUMMARY_CHARS),
                          "image": article["image"]
                      })
              return items[:PER_SOURCE]

          def load_source(source):
              for url in source["urls"]:
                  try:
                      data, _ = fetch(url)
                      try:
                          items = parse_feed(data, source["name"])
                      except ET.ParseError:
                          items = []
                      if items:
                          print(f"[ok] {source['name']}: {len(items)} berita dari {url}")
                          return items
                      print(f"[kosong] {source['name']}: {url}")
                  except Exception as error:
                      print(f"[gagal] {source['name']}: {url} -> {error}")
              return []

          def main():
              items, seen = [], set()
              for source in SOURCES:
                  for article in load_source(source):
                      key = re.sub(r"[?#].*$", "", article["link"]).rstrip("/")
                      if key not in seen:
                          seen.add(key)
                          items.append(article)

              if not items:
                  print("Tidak ada berita yang berhasil diambil; articles.json dibiarkan.")
                  return 0

              items.sort(key=lambda a: a["date"] or "", reverse=True)
              items = items[:MAX_ITEMS]

              for index, article in enumerate(items, 1):
                  if not article["image"]:
                      article["image"] = page_image(article["link"])
                  if article["image"] and not image_is_reachable(article["image"]):
                      print(f"[image] URL gambar tidak valid, dikosongkan: {article['title']}")
                      article["image"] = ""
                  print(
                      f"[{index}/{len(items)}] "
                      f"{'gambar OK' if article['image'] else 'tanpa gambar'}: "
                      f"{article['title'][:75]}"
                  )

              try:
                  with open(OUT, encoding="utf-8") as file:
                      old_data = json.load(file)
                      old = old_data.get("items")
              except Exception:
                  old = None

              if old == items:
                  print("Tidak ada perubahan pada daftar berita.")
                  return 0

              data = {
                  "updated": datetime.now(timezone.utc).isoformat(timespec="seconds"),
                  "items": items
              }
              with open(OUT, "w", encoding="utf-8") as file:
                  json.dump(data, file, ensure_ascii=False, indent=2)

              with_images = sum(1 for article in items if article["image"])
              print(
                  f"articles.json diperbarui: {len(items)} berita, "
                  f"{with_images} memiliki gambar valid."
              )
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Simpan jika ada perubahan
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet || (
            git commit -m "Update berita otomotif" &&
            git push
          )
          
