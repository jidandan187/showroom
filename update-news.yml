# Update berita otomotif otomatis (SATU FILE, tidak butuh file lain).
# Simpan file ini di repo dengan nama/path persis: .github/workflows/update-news.yml
name: Update berita otomotif

on:
  schedule:
    - cron: "17 */6 * * *"   # setiap 6 jam
  workflow_dispatch:          # tombol "Run workflow" manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambil berita dari RSS
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Mengambil berita otomotif dari RSS dan menulis articles.json.

          Hanya judul, tanggal, ringkasan pendek, gambar kecil, dan tautan ke sumber yang disimpan.
          Artikel lengkap TIDAK disalin; pembaca diarahkan ke situs sumber.
          Hanya memakai library bawaan Python.
          """
          import json, os, re, sys, html, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          import xml.etree.ElementTree as ET

          OUT = os.environ.get("NEWS_OUT", "articles.json")
          MAX_ITEMS = 12       # jumlah berita yang disimpan
          PER_SOURCE = 8       # maksimum berita per sumber
          SUMMARY_CHARS = 170  # panjang ringkasan
          UA = "Mozilla/5.0 (compatible; ThomyShowroomBot/1.0; +https://jidandan187.github.io/showroom/)"

          # Tiap sumber boleh punya beberapa alamat kandidat; yang pertama berhasil dipakai.
          # Tambah/hapus sumber di sini. Jika halaman RSS berupa HTML, skrip mencoba menemukan feed-nya.
          SOURCES = [
              {"name": "Antara Otomotif", "urls": [
                  "https://otomotif.antaranews.com/rss/terkini.xml",
                  "https://www.antaranews.com/rss/otomotif.xml",
                  "https://otomotif.antaranews.com/rss"]},
              {"name": "detikOto", "urls": [
                  "https://rss.detik.com/index.php/oto",
                  "https://oto.detik.com/rss"]},
              {"name": "Kompas Otomotif", "urls": [
                  "https://otomotif.kompas.com/rss",
                  "https://www.kompas.com/getrss/otomotif"]},
          ]
          if os.environ.get("FEEDS_OVERRIDE"):          # dipakai untuk pengujian
              SOURCES = json.loads(os.environ["FEEDS_OVERRIDE"])


          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/rss+xml, application/xml, text/xml, */*"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read()


          def local(tag):
              return tag.rsplit("}", 1)[-1].lower() if isinstance(tag, str) else ""


          def clean(text, limit=None):
              text = html.unescape(re.sub(r"<[^>]+>", " ", text or ""))
              text = re.sub(r"\s+", " ", text).strip()
              text = re.sub(r"^[A-Za-z .]{2,40}\((?:ANTARA|[A-Za-z]+)\)\s*[-–]\s*", "", text)
              if limit and len(text) > limit:
                  text = text[:limit].rsplit(" ", 1)[0].rstrip(",.;:- ") + "…"
              return text


          def parse_date(value):
              if not value:
                  return None
              value = value.strip()
              try:
                  dt = parsedate_to_datetime(value)
              except Exception:
                  try:
                      dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
                  except Exception:
                      return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(timezone.utc).isoformat(timespec="seconds")


          def safe_url(u):
              u = (u or "").strip()
              return u if re.match(r"^https?://", u, re.I) else ""


          def parse_feed(data, source):
              root = ET.fromstring(data)
              entries = [e for e in root.iter() if local(e.tag) in ("item", "entry")]
              items = []
              for e in entries[:PER_SOURCE * 2]:
                  f = {"title": "", "link": "", "date": None, "desc": "", "image": ""}
                  for c in e:
                      t = local(c.tag)
                      txt = (c.text or "").strip()
                      if t == "title":
                          f["title"] = clean(txt)
                      elif t == "link":
                          f["link"] = safe_url(c.attrib.get("href") or txt) or f["link"]
                      elif t in ("pubdate", "published", "updated", "date") and not f["date"]:
                          f["date"] = parse_date(txt)
                      elif t in ("description", "summary") and not f["desc"]:
                          f["desc"] = txt
                      elif t == "encoded" and not f["desc"]:
                          f["desc"] = txt
                      elif t in ("content", "thumbnail", "enclosure"):
                          u = safe_url(c.attrib.get("url"))
                          typ = (c.attrib.get("type") or c.attrib.get("medium") or "image").lower()
                          if u and "image" in typ and not f["image"]:
                              f["image"] = u
                  if not f["image"]:
                      m = re.search(r'<img[^>]+src=["\']([^"\']+)["\']', f["desc"], re.I)
                      if m:
                          f["image"] = safe_url(html.unescape(m.group(1)))
                  if f["title"] and f["link"]:
                      items.append({"title": f["title"], "link": f["link"], "source": source,
                                    "date": f["date"], "summary": clean(f["desc"], SUMMARY_CHARS), "image": f["image"]})
              return items[:PER_SOURCE]


          def og_image(url):
              """Ambil gambar utama (og:image) dari halaman artikel bila RSS tidak menyertakan gambar."""
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      page = r.read(300000).decode("utf-8", "ignore")
              except Exception:
                  return ""
              for pat in (r'<meta[^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]*content=["\']([^"\']+)["\']',
                          r'<meta[^>]+content=["\']([^"\']+)["\'][^>]*(?:property|name)=["\'](?:og:image|twitter:image)["\']'):
                  m = re.search(pat, page, re.I)
                  if m:
                      return safe_url(urllib.parse.urljoin(url, html.unescape(m.group(1))))
              return ""


          def discover(base, data):
              text = data.decode("utf-8", "ignore")
              found = re.findall(r'<link[^>]+type=["\']application/(?:rss|atom)\+xml["\'][^>]*href=["\']([^"\']+)["\']', text, re.I)
              found += re.findall(r'href=["\']([^"\']+\.xml)["\']', text, re.I)
              out = []
              for f in found:
                  u = urllib.parse.urljoin(base, f)
                  if u not in out:
                      out.append(u)
              return out[:5]


          def load_source(src):
              for url in src["urls"]:
                  try:
                      data = fetch(url)
                      try:
                          items = parse_feed(data, src["name"])
                      except ET.ParseError:
                          items = []
                          for alt in discover(url, data):
                              try:
                                  items = parse_feed(fetch(alt), src["name"])
                                  if items:
                                      break
                              except Exception:
                                  continue
                      if items:
                          print(f"[ok]   {src['name']}: {len(items)} berita dari {url}")
                          return items
                      print(f"[kosong] {src['name']}: {url}")
                  except Exception as ex:
                      print(f"[gagal] {src['name']}: {url} -> {ex}")
              return []


          def main():
              items, seen = [], set()
              for src in SOURCES:
                  for it in load_source(src):
                      key = re.sub(r"[?#].*$", "", it["link"])
                      if key not in seen:
                          seen.add(key)
                          items.append(it)
              if not items:
                  print("Tidak ada berita yang berhasil diambil; articles.json dibiarkan seperti semula.")
                  return 0
              items.sort(key=lambda x: x["date"] or "", reverse=True)
              items = items[:MAX_ITEMS]
              fetched = 0
              for it in items:                       # lengkapi gambar yang kosong (maks. 12 halaman per proses)
                  if not it["image"] and fetched < 12:
                      fetched += 1
                      it["image"] = og_image(it["link"])
              try:
                  old = json.load(open(OUT, encoding="utf-8")).get("items")
              except Exception:
                  old = None
              if old == items:
                  print("Tidak ada perubahan.")
                  return 0
              data = {"updated": datetime.now(timezone.utc).isoformat(timespec="seconds"), "items": items}
              with open(OUT, "w", encoding="utf-8") as fh:
                  json.dump(data, fh, ensure_ascii=False, indent=2)
              print(f"articles.json diperbarui: {len(items)} berita.")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
      - name: Simpan jika ada perubahan
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add articles.json
          git diff --cached --quiet || (git commit -m "Update berita otomotif" && git push)
